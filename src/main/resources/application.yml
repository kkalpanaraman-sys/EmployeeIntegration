server:
  port: 8080

spring:
  application:
    name: employee-integration-demo
  datasource:
    url: jdbc:h2:mem:employeesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

camel:
  springboot:
    name: employee-integration-demo
  spring:
    boot:
      main-run-controller: true

logging:
  level:
    com.example.employeeintegration: INFO
    org.apache.camel: INFO
